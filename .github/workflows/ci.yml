name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with its dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Report the decoding capabilities of this runner
        run: python -m owlg.cli check

      - name: Run the test suite
        run: pytest -q

  node:
    name: node package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check every ES module
        run: |
          shopt -s globstar nullglob
          files=(packages/owlg-js/**/*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .mjs files found under packages/owlg-js/" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Run the CLI help screen
        run: node packages/owlg-js/bin/owlg.mjs --help

  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build frontend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build
        run: python -m build

      - name: Show what was produced
        run: ls -l dist

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: owlg-dist
          path: dist/*
          if-no-files-found: error
